<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倾斜滑雪 · 预览</title>
<style>
  :root{
    --bg:#0f151d; --text:#e9eff5; --dim:rgba(233,239,245,.55);
    --line:rgba(255,255,255,.12); --accent:#9fd8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:22px 20px 6px;max-width:980px;margin:0 auto}
  h1{margin:0 0 6px;font-size:19px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin:0 0 10px}
  .wrap{max-width:980px;margin:0 auto;padding:8px 20px 60px;display:flex;gap:26px;
    flex-wrap:wrap;align-items:flex-start}
  .phone{position:relative;width:300px;max-width:100%;aspect-ratio:300/620;border-radius:26px;
    overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#111;
    box-shadow:0 14px 40px rgba(0,0,0,.4);flex:0 0 auto}
  .phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;
    pointer-events:none}
  .phone #chat{position:absolute;inset:0;overflow-y:auto;z-index:1;
    -webkit-overflow-scrolling:touch}
  .panel{flex:1 1 320px;min-width:260px;max-width:480px;display:flex;flex-direction:column;gap:14px}
  .card{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);
    padding:16px 16px 14px}
  .card h2{margin:0 0 8px;font-size:13.5px;font-weight:600}
  .card p{margin:0;color:var(--dim);font-size:12.5px}
  .row{display:flex;align-items:center;gap:10px;margin:12px 0 0}
  .row span{font-size:12px;color:var(--dim);min-width:46px}
  .row b{font-variant-numeric:tabular-nums;min-width:46px;text-align:right;font-weight:600}
  input[type=range]{flex:1;accent-color:var(--accent);height:28px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{appearance:none;border:1px solid rgba(255,255,255,.14);border-radius:999px;
    background:rgba(255,255,255,.06);color:var(--text);padding:8px 15px;font-size:13px;
    cursor:pointer;transition:background .15s}
  button:hover{background:rgba(255,255,255,.12)}
  button:disabled{opacity:.4;cursor:default}
  label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;
    cursor:pointer;user-select:none;margin-top:12px}
  .note{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>倾斜滑雪 · 预览</h1>
  <p class="sub">先等十几秒，让雪在气泡顶上堆出来；然后拖滑杆（或在手机上点「用手机倾斜」），雪就会往低的一侧流，流到气泡边上掉下去。摆平就停住，剩下的雪留在原地。</p>
</header>

<div class="wrap">
  <div class="phone">
    <div id="chat"></div>
    <iframe id="fx" title="雨雪层"></iframe>
  </div>

  <div class="panel">
    <div class="card">
      <h2>手机怎么歪</h2>
      <p>左边 = 往左歪，右边 = 往右歪。这个值就是 App 以后从重力传感器读出来、传给雪层的东西。</p>
      <div class="row">
        <span>左 ←</span>
        <input id="tilt" type="range" min="-100" max="100" step="1" value="0">
        <span>→ 右</span>
        <b id="val">0</b>
      </div>
      <div class="btns">
        <button id="btLeft">慢慢歪到左边</button>
        <button id="btRight">慢慢歪到右边</button>
        <button id="btFlat">摆平</button>
      </div>
      <label class="chk"><input type="checkbox" id="sway"> 自动来回歪（像手在晃）</label>
    </div>

    <div class="card">
      <h2>用真手机试</h2>
      <p>手机上打开这个页面，点下面这个按钮，然后真的把手机往左右歪。电脑上没有传感器，用上面的滑杆就行。</p>
      <div class="btns">
        <button id="btSensor">用手机倾斜</button>
      </div>
      <p class="note" id="sensorNote" style="margin-top:10px"></p>
    </div>

    <div class="card">
      <h2>现在的分寸</h2>
      <p>歪不到约 7° 不动（防手抖）；再往上开始滑，歪得越多越快；滑到边上就掉下去，带几粒雪末。摆正以后剩下的雪停住，不会自己回去。</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var fxFrame = document.getElementById('fx');
  fxFrame.src = '../fx.html?breeze=0';

  var ready = false, q = [];
  function send(msg) {
    if (ready) { try { fxFrame.contentWindow.postMessage(msg, '*'); } catch (_) {} }
    else q.push(msg);
  }

  var lines = [
    ['a', '下雪了。'],
    ['u', '嗯，窗台上已经有一层了。'],
    ['a', '雪落在气泡上，一小撮一小撮的。'],
    ['u', '你别动，让我看看。'],
    ['a', '好，我不动。'],
    ['u', '…真的不动？'],
    ['a', '真的。连这句话都是很慢地打出来的。'],
    ['u', '那我不客气了，我歪一下手机。']
  ];

  var chat = document.getElementById('chat');
  var inner = document.createElement('div');
  inner.style.cssText = 'display:flex;flex-direction:column;gap:10px;padding:18px 12px 96px;' +
    'max-width:560px;margin:0 auto';
  lines.forEach(function (pair, i) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;' + (pair[0] === 'u' ? 'justify-content:flex-end' : '');
    var b = document.createElement('div');
    b.dataset.msg = 'm' + i;
    b.textContent = pair[1];
    b.style.cssText = 'max-width:82%;padding:8px 12px;border-radius:14px;font-size:13px;' +
      'background:' + (pair[0] === 'u' ? 'rgba(159,216,255,.20)' : 'rgba(255,255,255,.13)') + ';' +
      'border:1px solid rgba(255,255,255,.12);width:fit-content;box-shadow:0 4px 14px rgba(0,0,0,.14)';
    row.appendChild(b);
    inner.appendChild(row);
  });
  chat.appendChild(inner);

  var input = document.createElement('div');
  input.id = 'input';
  input.textContent = '说点什么…';
  input.style.cssText = 'position:absolute;left:12px;right:12px;bottom:12px;z-index:3;' +
    'padding:10px 14px;border-radius:14px;font-size:13px;background:rgba(20,24,30,.66);' +
    'border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.55);backdrop-filter:blur(14px)';
  chat.appendChild(input);

  // 气泡坐标要换成雪层 iframe 自己的视口坐标（iframe 不在页面左上角）
  function pushBubbles() {
    if (!ready) return;
    var fr = fxFrame.getBoundingClientRect();
    var out = [];
    document.querySelectorAll('[data-msg]').forEach(function (el) {
      var r = el.getBoundingClientRect();
      out.push({ i: el.dataset.msg, l: Math.round(r.left - fr.left), t: Math.round(r.top - fr.top),
                 r: Math.round(r.right - fr.left), b: Math.round(r.bottom - fr.top) });
    });
    var ir = input.getBoundingClientRect();
    out.push({ i: 'input', l: Math.round(ir.left - fr.left), t: Math.round(ir.top - fr.top),
               r: Math.round(ir.right - fr.left), b: Math.round(ir.bottom - fr.top) });
    send({ type: 'weather-fx', op: 'setBubbles', value: out });
  }

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'weather-fx-ready') return;
    ready = true;
    while (q.length) {
      try { fxFrame.contentWindow.postMessage(q.shift(), '*'); } catch (_) {}
    }
    send({ type: 'weather-fx', op: 'setEffect',  value: 'soft-snow' });
    send({ type: 'weather-fx', op: 'setCount',   value: 90 });
    send({ type: 'weather-fx', op: 'setSpeed',   value: 1 });
    send({ type: 'weather-fx', op: 'setOpacity', value: 90 });
    send({ type: 'weather-fx', op: 'setSplash',  value: false });
    send({ type: 'weather-fx', op: 'setAccumulate', value: true });
    pushBubbles();
  });

  /* ---------- 控制 ---------- */
  var slider = document.getElementById('tilt');
  var val = document.getElementById('val');
  var sway = document.getElementById('sway');
  var swayTimer = null;
  var swayT = 0;

  function apply(v) {
    slider.value = v;
    val.textContent = Math.round(v);
    send({ type: 'weather-fx', op: 'setTilt', value: v });
  }

  slider.addEventListener('input', function () {
    if (sway.checked) { sway.checked = false; stopSway(); }
    apply(Number(slider.value));
  });

  function slideTo(target, ms) {
    var from = Number(slider.value);
    var t0 = performance.now();
    function step(t) {
      var u = Math.min(1, (t - t0) / ms);
      var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      apply(from + (target - from) * e);
      if (u < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  document.getElementById('btLeft').addEventListener('click', function () {
    sway.checked = false; stopSway(); slideTo(-100, 900);
  });
  document.getElementById('btRight').addEventListener('click', function () {
    sway.checked = false; stopSway(); slideTo(100, 900);
  });
  document.getElementById('btFlat').addEventListener('click', function () {
    sway.checked = false; stopSway(); slideTo(0, 700);
  });

  function stopSway() { if (swayTimer) { clearInterval(swayTimer); swayTimer = null; } }
  sway.addEventListener('change', function () {
    stopSway();
    if (!sway.checked) return;
    swayT = 0;
    swayTimer = setInterval(function () {
      swayT += 0.045;
      apply(Math.round(Math.sin(swayT) * 100));
    }, 33);
  });

  /* ---------- 真手机倾斜 ---------- */
  var btSensor = document.getElementById('btSensor');
  var sensorNote = document.getElementById('sensorNote');
  var sensorOn = false;

  function onOrient(e) {
    if (!sensorOn) return;
    // 竖屏时左右歪。安卓上报的 gamma 跟我们约定的方向是反的：
    // 屏幕右边压下去时 gamma 是负的 —— 直接拿去用，雪会往高的那一侧流
    // （1124 曼曼在手机上实测：方向反了）。所以取反，右边压低 = 正 = 雪往右滑。
    var g = (typeof e.gamma === 'number') ? -e.gamma : 0;
    var v = Math.max(-100, Math.min(100, g / 45 * 100));
    slider.value = v;
    val.textContent = Math.round(v);
    send({ type: 'weather-fx', op: 'setTilt', value: v });
  }

  if (typeof DeviceOrientationEvent === 'undefined') {
    btSensor.disabled = true;
    sensorNote.textContent = '这个浏览器读不到手机倾斜（电脑上就是这样），用上面的滑杆看效果。';
  } else {
    sensorNote.textContent = '第一次点会问要不要允许方向权限。歪手机的时候滑杆会跟着动。';
  }

  btSensor.addEventListener('click', function () {
    sway.checked = false; stopSway();
    if (sensorOn) {
      sensorOn = false;
      window.removeEventListener('deviceorientation', onOrient);
      btSensor.textContent = '用手机倾斜';
      sensorNote.textContent = '停用了。回到用滑杆。';
      return;
    }
    var start = function () {
      sensorOn = true;
      window.addEventListener('deviceorientation', onOrient);
      sensorNote.textContent = '已经接上了。现在把手机往左、往右歪试试；再点一次就停。';
      btSensor.textContent = '停用手机倾斜';
    };
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (res) {
        if (res === 'granted') start();
        else sensorNote.textContent = '没给权限，读不到倾斜。可以在系统设置里重新允许，或者用滑杆。';
      }).catch(function () {
        sensorNote.textContent = '没给权限，读不到倾斜。用滑杆看效果就行。';
      });
    } else {
      start();
    }
  });

  setInterval(pushBubbles, 350);
  window.addEventListener('resize', pushBubbles);
})();
</script>
</body>
</html>
