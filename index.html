<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Corvus Weather FX · 演示</title>
<style>
  :root{
    --ink:#f2f5f7; --ink-dim:rgba(242,245,247,.62);
    --panel:rgba(22,26,31,.62); --panel-line:rgba(255,255,255,.1);
    --accent:#9fd8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141a21;color:var(--ink);
    font:14px/1.4 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

  /* 演示用的「壁纸」：纯 CSS 渐变，不打包任何图片素材 */
  #wall{
    position:fixed;inset:0;
    background:
      radial-gradient(60% 50% at 18% 22%, rgba(255,206,140,.35), transparent 70%),
      radial-gradient(45% 45% at 78% 18%, rgba(140,200,255,.30), transparent 70%),
      radial-gradient(55% 55% at 62% 78%, rgba(255,160,150,.24), transparent 70%),
      radial-gradient(40% 40% at 24% 84%, rgba(180,255,228,.18), transparent 70%),
      linear-gradient(180deg,#22303f 0%,#3d4b5c 48%,#6b5a4b 100%);
  }
  #wall::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.45) 100%)}

  .layer{position:fixed;inset:0;width:100%;height:100%;border:0;
    pointer-events:none;opacity:0;transition:opacity .45s ease}
  .layer.on{opacity:1}

  /* ---- 控制台 ---- */
  #panel{
    position:fixed;top:14px;left:14px;z-index:10;width:340px;max-width:calc(100vw - 28px);
    max-height:calc(100vh - 28px);overflow:auto;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    padding:14px 14px 16px;
  }
  #panel h1{font-size:15px;margin:2px 0 2px;letter-spacing:.02em}
  #panel .sub{color:var(--ink-dim);font-size:12px;margin-bottom:12px}
  .group{margin:12px 0 0}
  .group-title{font-size:11px;letter-spacing:.12em;color:var(--ink-dim);
    margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    appearance:none;border:1px solid var(--panel-line);background:rgba(255,255,255,.06);
    color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s;
  }
  .chip:hover{background:rgba(255,255,255,.12)}
  .chip.on{background:rgba(159,216,255,.22);border-color:rgba(159,216,255,.55);color:#eaf7ff}

  .slider{display:grid;grid-template-columns:72px 1fr 46px;align-items:center;gap:8px;
    margin:8px 0;font-size:13px}
  .slider span:first-child{color:var(--ink-dim)}
  .slider output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
  input[type=range]{width:100%;accent-color:var(--accent);background:transparent}

  .auto{display:flex;gap:8px;margin-top:6px}
  .auto input[type=text]{
    flex:1;min-width:0;border:1px solid var(--panel-line);border-radius:10px;
    background:rgba(0,0,0,.22);color:var(--ink);padding:8px 10px;font-size:13px;outline:none}
  .auto input[type=text]:focus{border-color:rgba(159,216,255,.55)}
  .auto button{
    appearance:none;border:1px solid rgba(159,216,255,.45);border-radius:10px;
    background:rgba(159,216,255,.16);color:#eaf7ff;padding:8px 14px;cursor:pointer;font-size:13px}
  .auto button.off{border-color:var(--panel-line);background:rgba(255,255,255,.06);color:var(--ink)}
  #autoStatus{font-size:12px;color:var(--ink-dim);margin-top:8px;min-height:17px}

  #tip{position:fixed;right:14px;bottom:14px;z-index:9;font-size:12px;color:rgba(255,255,255,.55);
    text-align:right;pointer-events:none}
</style>
</head>
<body>
<div id="wall"></div>

<iframe id="f-glass"   class="layer" src="glass.html"   title="雨水玻璃"></iframe>
<iframe id="f-caustic" class="layer" src="caustic.html" title="焦散水波"></iframe>
<iframe id="f-fx"      class="layer" src="fx.html"      title="雨雪特效"></iframe>
<iframe id="f-sky"     class="layer" src="sky.html"     title="天空特效"></iframe>

<div id="panel">
  <h1>Corvus 天气特效</h1>
  <div class="sub">11 种特效 + 实时天气自动切换 · 本地演示</div>

  <div class="group">
    <div class="group-title">特效</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="group" id="params"></div>

  <div class="group">
    <div class="group-title">跟着天气自动换（wttr.in）</div>
    <div class="auto">
      <input id="city" type="text" placeholder="城市，留空按 IP 定位，比如：银川">
      <button id="autoBtn">开启</button>
    </div>
    <div id="autoStatus"></div>
  </div>
</div>

<div id="tip">← 点左边切特效；雨雪那档可以拖参数</div>

<script src="weather.js"></script>
<script>
(function () {
  'use strict';

  /* ---------------- 特效表 ----------------
     page 决定挂哪一层 iframe；fx/sky 是发给那一页的初始参数。 */
  const EFFECTS = {
    off:     { label: '关',       page: null },
    glass:   { label: '雨水玻璃', page: 'glass' },
    slant:   { label: '斜飘雪花', page: 'fx',  fx: { effect: 'slant-snow',  count: 50, speed: 0.55, opacity: 100 } },
    streak:  { label: '垂直雨丝', page: 'fx',  fx: { effect: 'rain-streak', count: 60, speed: 0.9,  opacity: 100 } },
    soft:    { label: '柔光飘雪', page: 'fx',  fx: { effect: 'soft-snow',   count: 70, speed: 1,    opacity: 90  } },
    fog:     { label: '柔雾',     page: 'fx',  fx: { effect: 'soft-fog',    count: 60, speed: 1,    opacity: 70  } },
    caustic: { label: '焦散水波', page: 'caustic' },
    clear:   { label: '晴天光网', page: 'sky', sky: { kind: 'clear',   strength: 100 } },
    cloudy:  { label: '多云',     page: 'sky', sky: { kind: 'cloudy',  strength: 55  } },
    storm:   { label: '雷雨',     page: 'sky', sky: { kind: 'storm',   strength: 50  } },
    haze:    { label: '霾',       page: 'sky', sky: { kind: 'fog',     strength: 50  } },
    rainbow: { label: '彩虹',     page: 'sky', sky: { kind: 'rainbow', strength: 75  } }
  };

  const frameEls = {
    glass:   document.getElementById('f-glass'),
    caustic: document.getElementById('f-caustic'),
    fx:      document.getElementById('f-fx'),
    sky:     document.getElementById('f-sky')
  };
  const READY_TYPE = {
    'weather-glass-ready':   'glass',
    'weather-caustic-ready': 'caustic',
    'weather-fx-ready':      'fx',
    'weather-sky-ready':     'sky'
  };

  const ready = { glass: false, caustic: false, fx: false, sky: false };
  const pending = { glass: [], caustic: [], fx: [], sky: [] };

  function send(page, msg) {
    if (!page) return;
    if (ready[page]) {
      try { frameEls[page].contentWindow.postMessage(msg, '*'); } catch (_) {}
    } else {
      pending[page].push(msg);
    }
  }

  window.addEventListener('message', function (e) {
    const name = READY_TYPE[e.data && e.data.type];
    if (!name) return;
    ready[name] = true;
    const queue = pending[name];
    pending[name] = [];
    for (const msg of queue) {
      try { frameEls[name].contentWindow.postMessage(msg, '*'); } catch (_) {}
    }
  });

  /* ---------------- UI 状态 ---------------- */
  let active = 'off';
  let fxParams = null;      // { count, speed, opacity }
  let skyStrength = 55;
  let stopAuto = null;

  const chipsEl = document.getElementById('chips');
  const paramsEl = document.getElementById('params');
  const statusEl = document.getElementById('autoStatus');
  const cityEl = document.getElementById('city');
  const autoBtn = document.getElementById('autoBtn');

  for (const key of Object.keys(EFFECTS)) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.key = key;
    chip.textContent = EFFECTS[key].label;
    chip.addEventListener('click', function () { select(key); });
    chipsEl.appendChild(chip);
  }

  function showOnly(page) {
    for (const name of Object.keys(frameEls)) {
      const on = name === page;
      frameEls[name].classList.toggle('on', on);
      // 看不见的那层停掉动画，别让四个 iframe 一起跑满 CPU
      if (name === 'fx')    send('fx',    { type: 'weather-fx',    op: 'setPaused', value: !on });
      if (name === 'sky')   send('sky',   { type: 'weather-sky',   op: 'setPaused', value: !on });
      if (name === 'glass') send('glass', { type: 'weather-glass', op: on ? 'start' : 'stop' });
    }
  }

  function slider(label, value, min, max, step, fmt, onInput) {
    const row = document.createElement('label');
    row.className = 'slider';
    const name = document.createElement('span');
    name.textContent = label;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = min; input.max = max; input.step = step; input.value = value;
    const out = document.createElement('output');
    out.textContent = fmt(value);
    input.addEventListener('input', function () {
      const v = Number(input.value);
      out.textContent = fmt(v);
      onInput(v);
    });
    row.append(name, input, out);
    return row;
  }

  function renderParams() {
    paramsEl.replaceChildren();
    const def = EFFECTS[active];

    if (def.page === 'fx' && fxParams) {
      paramsEl.className = 'group';
      const t = document.createElement('div');
      t.className = 'group-title';
      t.textContent = '参数';
      const spec = { 'slant-snow': [50, 70, 5], 'rain-streak': [15, 120, 1],
                     'soft-snow': [12, 90, 1], 'soft-fog': [12, 90, 1] }[fxParams.effect] || [12, 120, 1];
      paramsEl.append(
        t,
        slider('数量', fxParams.count, spec[0], spec[1], spec[2], v => String(v), function (v) {
          fxParams.count = v;
          send('fx', { type: 'weather-fx', op: 'setCount', value: v });
        }),
        slider('速度', fxParams.speed, 0.25, 2, 0.05, v => v.toFixed(2) + '×', function (v) {
          fxParams.speed = v;
          send('fx', { type: 'weather-fx', op: 'setSpeed', value: v });
        }),
        slider('浓度', fxParams.opacity, 10, 100, 1, v => v + '%', function (v) {
          fxParams.opacity = v;
          send('fx', { type: 'weather-fx', op: 'setOpacity', value: v });
        })
      );
    } else if (def.page === 'sky' && def.sky) {
      paramsEl.className = 'group';
      const t = document.createElement('div');
      t.className = 'group-title';
      t.textContent = '参数';
      paramsEl.append(
        t,
        slider('强度', skyStrength, 10, 130, 1, v => String(v), function (v) {
          skyStrength = v;
          send('sky', { type: 'weather-sky', op: 'setStrength', value: v });
        })
      );
    } else if (def.page === 'caustic') {
      paramsEl.className = 'group';
      const t = document.createElement('div');
      t.className = 'group-title';
      t.textContent = '参数';
      paramsEl.append(
        t,
        slider('亮度', 100, 0, 160, 1, v => v + '%', function (v) {
          send('caustic', { type: 'weather-caustic', op: 'setPower', value: v });
        }),
        slider('透出', 55, 0, 100, 1, v => v + '%', function (v) {
          send('caustic', { type: 'weather-caustic', op: 'setOpacity', value: v });
        })
      );
    } else {
      paramsEl.className = '';
    }
  }

  /* ---------------- 切特效 ---------------- */
  function select(key, fromAuto) {
    if (!EFFECTS[key]) return;
    active = key;
    const def = EFFECTS[key];

    for (const chip of chipsEl.children) chip.classList.toggle('on', chip.dataset.key === key);
    showOnly(def.page);

    if (def.page === 'fx') {
      fxParams = Object.assign({}, def.fx);
      send('fx', { type: 'weather-fx', op: 'setEffect',  value: fxParams.effect });
      send('fx', { type: 'weather-fx', op: 'setCount',   value: fxParams.count });
      send('fx', { type: 'weather-fx', op: 'setSpeed',   value: fxParams.speed });
      send('fx', { type: 'weather-fx', op: 'setOpacity', value: fxParams.opacity });
    }
    if (def.page === 'sky') {
      skyStrength = def.sky.strength;
      send('sky', { type: 'weather-sky', op: 'setStrength', value: def.sky.strength });
      send('sky', { type: 'weather-sky', op: 'setState',    value: def.sky.kind });
    }
    if (def.page === null) {
      send('sky', { type: 'weather-sky', op: 'setState', value: 'none' });
    }
    renderParams();

    if (!fromAuto && stopAuto) stopAuto();   // 手动点就退出自动
  }

  /* ---------------- 自动天气 ---------------- */
  function planToKey(plan) {
    if (plan.sky) {
      if (plan.sky.kind === 'fog') return 'haze';
      return plan.sky.kind;
    }
    if (plan.fx) {
      return { 'rain-streak': 'streak', 'slant-snow': 'slant',
               'soft-snow': 'soft', 'soft-fog': 'fog' }[plan.fx.effect] || null;
    }
    return null;
  }

  function startAuto() {
    const city = cityEl.value.trim() || undefined;
    autoBtn.textContent = '停止';
    autoBtn.classList.remove('off');
    statusEl.textContent = '正在查询…';

    stopAuto = WeatherFX.auto({
      city: city,
      onReading: function (reading, plan) {
        const key = planToKey(plan);
        if (key) {
          // 自动模式下按 plan 的参数来，不套 EFFECTS 里的默认值
          if (plan.fx) {
            EFFECTS[key].fx = plan.fx;
          }
          if (plan.sky) {
            EFFECTS[key].sky = { kind: plan.sky.kind, strength: plan.sky.strength };
          }
          select(key, true);
        }
        statusEl.textContent = reading.label + ' ' + reading.temp + '°　·　' +
          reading.kind + ' / level ' + reading.level +
          (city ? '' : '　·　按 IP 定位');
      },
      onFail: function () {
        statusEl.textContent = '这次没查到，先保持上一次的画面';
      }
    });
  }

  autoBtn.addEventListener('click', function () {
    if (stopAuto) {
      stopAuto();
      stopAuto = null;
      autoBtn.textContent = '开启';
      autoBtn.classList.add('off');
      statusEl.textContent = '自动已关闭，回到手选';
    } else {
      startAuto();
    }
  });

  select('slant');
})();
</script>
</body>
</html>
